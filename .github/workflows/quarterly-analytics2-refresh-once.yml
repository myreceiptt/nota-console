name: IMPROMPTU Quarterly Analytics v2 lockfile refresh (one-time)

on:
  pull_request:
    paths:
      - "package.json"
      - "tests/browser-recovery.cjs"
      - ".github/workflows/quarterly-analytics2-refresh-once.yml"

permissions:
  contents: write

jobs:
  update-analytics-only:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evergreen/2026q4-analytics2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout controlled internal PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Yarn 4
        run: corepack enable

      - name: Refresh lockfile ONLY for Vercel Analytics v2
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install

      - name: Verify reproducible immutable dependency install
        run: yarn install --immutable

      - name: Verify only approved Analytics major
        run: |
          node -e 'const p=require("./package.json"); if(p.dependencies["@vercel/analytics"]!=="^2.0.1")throw Error("Unexpected analytics range"); if(p.dependencies.typescript!=="^7.0.2"||p.devDependencies.vite!=="^8.3.8")throw Error("Previous toolchain baseline changed")'
          node -e 'const p=require("./node_modules/@vercel/analytics/package.json"); if(p.version!=="2.0.1")throw Error("Unexpected Analytics installed version: "+p.version); console.log("Installed analytics: "+p.version)'
          grep -Fq "import { Analytics } from '@vercel/analytics/react';" src/components/layout/Main.tsx
          grep -Fq '<Analytics />' src/components/layout/Main.tsx

      - name: Recursive security audit moderate and above
        run: yarn npm audit -R --severity moderate

      - name: Native TypeScript 7 typecheck
        run: yarn lint

      - name: Recovery unit regressions
        run: yarn test:recovery

      - name: Vite 8 production build
        run: yarn build

      - name: Chrome 157 six terminal checks plus Analytics v2 integration
        run: node tests/browser-recovery.cjs

      - name: Verify patch integrity
        run: git diff --check

      - name: Commit ONLY the lockfile after all gates succeed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if git diff --cached --quiet; then
            echo "Lockfile already matches approved Analytics v2 dependency."
          else
            git commit -m "chore(evergreen Q4): resolve Vercel Analytics 2.0.1 lockfile"
            git push origin HEAD:refs/heads/evergreen/2026q4-analytics2
          fi
