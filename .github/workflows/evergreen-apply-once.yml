name: EVERGREEN one-time safe monthly refresh

on:
  pull_request:
    paths:
      - "scripts/evergreen-refresh.cjs"
      - ".github/workflows/evergreen-apply-once.yml"

permissions:
  contents: write

jobs:
  monthly-refresh:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evergreen/2026-11-monthly' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout controlled internal PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack Yarn
        run: corepack enable

      - name: Install locked baseline
        run: yarn install --immutable

      - name: Refresh direct ranges within EXISTING majors ONLY
        run: node scripts/evergreen-refresh.cjs

      - name: Refresh Yarn within same major
        run: yarn set version stable

      - name: Refresh dependency resolutions within declared ranges
        run: yarn up -R '*'

      - name: Check immutable reproducibility
        run: yarn install --immutable

      - name: Audit full tree at moderate severity
        run: yarn npm audit -R --severity moderate

      - name: TypeScript typecheck
        run: yarn lint

      - name: Chrome scroll regression
        run: yarn test:recovery

      - name: Production build
        run: yarn build

      - name: Chrome UI smoke
        run: node tests/browser-recovery.cjs

      - name: Commit only verified dependency and toolchain files to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json yarn.lock .yarnrc.yml .yarn/releases
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "chore(evergreen): refresh safe monthly dependencies and Yarn 4"
            git push origin HEAD:refs/heads/evergreen/2026-11-monthly
          fi
