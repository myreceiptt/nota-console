name: IMPROMPTU Quarterly TypeScript 7 lockfile refresh (one-time)

on:
  pull_request:
    paths:
      - "package.json"
      - "tsconfig.json"
      - "tests/scroll-effects.test.cjs"
      - ".github/workflows/quarterly-typescript7-refresh-once.yml"

permissions:
  contents: write

jobs:
  migrate-typescript:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evergreen/2026q4-typescript7' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout controlled internal PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Yarn 4
        run: corepack enable

      - name: Update lockfile for TypeScript 7 toolchain only
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install

      - name: Verify immutable dependency install
        run: yarn install --immutable

      - name: Verify native compiler and test API compatibility
        run: |
          yarn tsc --version
          node -e 'const ts=require("@typescript/typescript6"); if (!ts.transpileModule) throw Error("Missing legacy test compiler API"); console.log("TypeScript 6 test API: "+ts.version)'
          node -e 'const p=require("./package.json"); if(!p.dependencies.typescript.startsWith("^7.")||!p.devDependencies["@typescript/typescript6"].startsWith("^6.")) process.exit(1)'

      - name: Recursive security audit moderate and above
        run: yarn npm audit -R --severity moderate

      - name: TypeScript 7 typecheck
        run: yarn lint

      - name: Recovery unit regression tests using TS6 shim
        run: yarn test:recovery

      - name: Vite 8 production build
        run: yarn build

      - name: Chrome 157 console and command parity
        run: node tests/browser-recovery.cjs

      - name: Verify clean patch
        run: git diff --check

      - name: Commit reviewed Yarn lockfile only after green gates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if git diff --cached --quiet; then
            echo "No lockfile update necessary."
          else
            git commit -m "chore(evergreen Q4): resolve native TypeScript 7 and TS6 shim"
            git push origin HEAD:refs/heads/evergreen/2026q4-typescript7
          fi
