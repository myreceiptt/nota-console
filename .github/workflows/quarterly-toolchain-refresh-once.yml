name: IMPROMPTU Quarterly Toolchain Refresh (one-time)

on:
  pull_request:
    paths:
      - "package.json"
      - ".github/workflows/quarterly-toolchain-refresh-once.yml"

permissions:
  contents: write

jobs:
  upgrade-vite-toolchain:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evergreen/2026q4-vite8-toolchain' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact internal branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Yarn 4 via Corepack
        run: corepack enable

      - name: Resolve ONLY declared Vite 8 / React plugin 6 major cluster
        run: yarn install

      - name: Check reproducible immutable install
        run: yarn install --immutable

      - name: Audit full dependency tree
        run: yarn npm audit -R --severity moderate

      - name: Typecheck
        run: yarn lint

      - name: React scroll regression
        run: yarn test:recovery

      - name: Vite production build
        run: yarn build

      - name: Chrome 157 console and command parity
        run: node tests/browser-recovery.cjs

      - name: Confirm no untracked application source edits
        run: git diff --check

      - name: Commit lockfile ONLY after all verification gates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if git diff --cached --quiet; then
            echo "Lockfile already matches requested toolchain."
          else
            git commit -m "chore(evergreen quarterly): refresh Vite 8 toolchain lockfile"
            git push origin HEAD:refs/heads/evergreen/2026q4-vite8-toolchain
          fi
