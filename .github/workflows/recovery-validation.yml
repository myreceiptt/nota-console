name: IMPROMPTU Recovery Validation

on:
  pull_request:
    paths:
      - "src/components/terminal/TerminalContainer.tsx"
      - "src/hooks/useScrollToBottom.ts"
      - "tests/scroll-effects.test.cjs"
      - "tests/browser-recovery.cjs"
      - "tests/ai-foundation.test.cjs"
      - "tests/ai-pilot-deny.test.cjs"
      - "tests/ai-pilot-security.test.cjs"
      - "tests/p53-auth.test.cjs"
      - "api/**"
      - "lib/ai/**"
      - "src/components/ai/**"
      - "src/components/layout/ModeShell.tsx"
      - "vercel.json"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/recovery-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (read-only credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use repository Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack / Yarn
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn lint

      - name: Regression tests (Promise-returning and legacy scroll)
        run: yarn test:recovery

      - name: Foundation sandbox HTTP contract tests (zero LLM calls)
        run: yarn test:foundation

      - name: P5.1R deny-first pilot HTTP contract tests (no provider calls)
        run: node --test tests/ai-pilot-deny.test.cjs tests/ai-pilot-security.test.cjs tests/p53-auth.test.cjs

      - name: Production build
        run: yarn build

      - name: Browser recovery smoke test
        run: node tests/browser-recovery.cjs

      - name: P5.2 protected-mode browser fixture (zero provider calls)
        run: |
          VITE_P51R_PREVIEW_UI=true yarn build
          P52_BROWSER=1 node tests/browser-recovery.cjs
