name: IMPROMPTU Recovery Validation

on:
  pull_request:
    paths:
      - "src/components/terminal/TerminalContainer.tsx"
      - "src/hooks/useScrollToBottom.ts"
      - "tests/scroll-effects.test.cjs"
      - "tests/browser-recovery.cjs"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/recovery-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (read-only credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use repository Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack / Yarn
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn lint

      - name: Regression tests (Promise-returning and legacy scroll)
        run: yarn test:recovery

      - name: Production build
        run: yarn build

      - name: Browser recovery smoke test
        run: node tests/browser-recovery.cjs
